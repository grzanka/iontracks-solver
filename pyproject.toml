[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iontracks-solver"
version = "0.1.0"
description = "Pulsed-beam ion-chamber recombination solver -- naive starting point (training material)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "pandas",
    "scipy",
    "mpmath",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["ion_chamber*"]

[tool.setuptools.package-data]
ion_chamber = ["data/*"]
